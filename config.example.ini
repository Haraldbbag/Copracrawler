; Copracrawler – Konfiguration
; Diese Datei als config.ini neben das Skript kopieren und anpassen.
; config.ini enthält das Passwort im Klartext: Dateirechte so setzen, dass nur
; der Benutzer der geplanten Aufgabe sie lesen kann. config.ini nie committen.

[copra]
; Login ist die E-Mail-Adresse des COPRA-Accounts
email    = Test@abc.com
passwort = DeinPasswort
; Nur ändern, falls COPRA die Adresse der Schnittstelle ändert
api_url  = https://api.copra.app/v2

[ablage]
; Ordner für copra_speicher.csv, copra_laeufe.csv und die Logdatei.
; Leer = Ordner des Skripts. Relative Pfade gelten relativ zu dieser Datei.
; Beispiele:  D:\COPRA-Auswertung   oder   \\server\freigabe\copra
csv_ordner =

[abruf]
; Wie oft bei Netz-/Serverfehlern erneut versucht wird
versuche = 3
wartezeit_sekunden = 60
timeout_sekunden = 90
